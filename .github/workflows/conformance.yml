name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Nushell version
        id: pinned
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < NU_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: hustcer/setup-nu@v3
        with:
          version: "${{ steps.pinned.outputs.version }}"

      - name: Run conformance tests
        run: nu run.nu

      - name: Check rules and test links
        run: nu check.nu
